<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
    body {
        /* /* background: linear-gradient(
        135deg,
        #1e293b,
        #0f172a */
        background-image: url("https://images.openai.com/static-rsc-4/UtBU0ygpQHR3PNDOOLAitsy72XUsWgIVmHY_fp-TE1Cdh-uHeJPvyKXUBNmb2dJe695yJiQPfy_aDLL5tren8K56pjxQr3NGE6VHdNTL9hs82sD5kplnpIgxd_qfbMscWthgZDZkllNHymMCfGbroV2tWvTo8U3xjc9OR49E6WPfSrhKE4JnpTE-FxUz6ObK?purpose=fullsize");
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;

    }

    .div1 {
        background: rgba(22, 28, 35, .42);
        border: 1px solid rgba(255, 255, 255, .08);
        width: 750px;
        height: 690px;
        margin-top: 110px;
        /* background: linear-gradient(135deg, #4facfe, #6a5af9); */
        backdrop-filter: blur(22px);
        border-radius: 25px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
        animation-name: fadeup;
        animation-duration: 3s;
        position: relative;
        transform: translateY(-40px);
    }

    @keyframes fadeup {

        from {
            opacity: 0;
            transform: translateY(35px);
        }

        to {
            opacity: 1;
            transform: translateY(1);
        }

    }

    button {
        background: linear-gradient(135deg, #00c6FF, #0095Ff, #4f46e5, #7c3aed);
        color: white;
        width: 145px;
        border: none;
        padding: 11px 35px;
        border-radius: 40px;
        font-weight: bold;
        cursor: pointer;
        position: relative;
        left: 78%;
        bottom: 16.5%;
        transition: .3s;
        box-shadow: 0 8px 25px rgba(0, 212, 255, .35);
    }

    button:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 12px 30px rgba(0, 198, 255, .45);
    }

    h1 {
        font-size: 50px;
        font-weight: 800;
        letter-spacing: .5px;
        font-weight: bold;
        color: white;
        text-shadow: 0px 0px 15px rgb(0, 212, 255, .28);
        background: linear-gradient(90deg, #FFFFFF, #9BE7FF, #FFFFFF);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
    }

    h4 {
        color: white;
    }
    h6{
        color: white;
    }

    p {
        font-size: 20px;
        color: rgba(255, 255, 255, .8);
    }

    input {
        border-radius: 50px;
        padding: 18px 25px;
        background-color: rgba(255, 255, 255, .95);
        height: 60px;
        border: none;
        box-shadow: 0 0 18px rgba(59, 130, 246, .20);
    }

    input:focus {
        box-shadow: 0 0 0 4px rgba(0, 198, 255, .18);

    }

    .ico2 {
        position: relative;
        left: 18px;
        top: 8.5%;
        transform: translateY(-50%);
        color: #7DD3FC;
    }

    .ico {
        color: #fdb813;
        position: relative;
        font-size: 46px;
        left: 9%;
        top: 9.5%;
        bottom: 10.5px;
    }

    .ico1 {
        position: relative;
        color: #ffffff;
        font-size: 46px;
        top: 11.5%;
        left: 3%;


    }
</style>

<body>
    <div class="div1 container">
        <i class="fa-solid fa-sun ico"></i><i class="fa-solid fa-cloud ico1"></i>
        <h1 class="mt-3 text-center">Weather Search</h1>
        <p class="text-center">Search any city to get current weather updates</p>
        <i class="fa-solid fa-magnifying-glass ico2"></i>
        <input class="box container text-center" id="city" type="search" placeholder="Enter city name...">
        <p class="container text-center">Real-time weather • Accurate forecasts • Worldwide</p>
        <button onclick="learn()">Search <i class="fa-solid fa-arrow-right"></i></button>

        <div id="result">

        </div>

    </div>


    <script>
        let apikey = "a5b412a04292f984f0050324e1e59345"

        async function learn() {
            let city = document.getElementById("city").value

            if (city == "") {

                alert = ("enter city name")
            }

            let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apikey}&units=metric`

            try {

                const response = await fetch(url)
                const data = await response.json();
                console.log(data);

                document.getElementById("result").innerHTML = `
                <h1>${data.name}</h1>
                <h4>${data.sys.country}</h4>
                <h6><i class="fa-regular fa-clock"></i>${data.timezone}</h6>
                <h6><i class="fa-solid fa-wind"></i>${data.wind.speed}</h6>
                <p><i class="fa-solid fa-cloud"></i>${data.clouds.all}</p>
                <p><i class="fa-solid fa-temperature-empty"></i>${data.main.temp}</p>
                <p><i class="fa-solid fa-bolt"></i>${data.weather[0].description}</p>
                
                `

            }

            catch (arr) {
                console.log("something error")
            }

        }
    </script>

</body>

</html>
